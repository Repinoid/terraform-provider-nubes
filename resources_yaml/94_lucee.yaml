name: lucee
service_id: 94
service_display_name: Lucee
service_short_name: lucee
lifecycle:
    suspend_on_destroy_default: true
    adopt_existing_on_create_default: false
outputs:
    params:
        - code: state_params
          type: map
        - code: state_out
          type: map
        - code: state_params_flat
          type: map
        - code: state_out_flat
          type: map
        - code: vault_secrets
          type: map
          sensitive: true
        - code: vault_url
          type: string
        - code: vault_user_path
          type: string
        - code: vault_fields
          type: list
operations:
    - name: create
      id: 49
      kind: instance
      action: create
      params:
        - id: 1019
          code: startupConfiguration
          data_type: map-fixed
          required: true
          sort: 10
          sub_params:
            - id: 430
              code: resourceRealm
              data_type: string
              required: true
              default: k8s-4-ext-nubes-ru
              value_list:
                - k8s-4-ext-nubes-ru
              man: Кластер Kubernetes, на котором будет развернут экземпляр
              is_modifiable: false
        - id: 1020
          code: clusterConfiguration
          data_type: map-fixed
          required: true
          sort: 20
          is_modifiable: true
          sub_params:
            - id: 431
              code: cpu
              data_type: string
              required: true
              default: "200"
              man: Указывается в Milicores<br/>`1000` Mili == `1` Ядро
              is_modifiable: false
            - id: 432
              code: memory
              data_type: integer &gt; 0
              required: true
              default: "256"
              man: Указывается в Megabytes
              is_modifiable: false
            - id: 433
              code: replicas
              data_type: integer &gt; 0
              required: true
              default: "1"
              value_list:
                - "1"
                - "3"
                - "5"
                - "7"
              is_modifiable: false
        - id: 1021
          code: accessConfiguration
          data_type: map-fixed
          required: true
          sort: 30
          sub_params:
            - id: 434
              code: domain
              data_type: string
              required: true
              default: lucee-usxplpdf
              man: 'Если указан FQDN в формате: `myapp.example.com`, предварительно будет проверяться DNS-запись (А-запись **должна смотреть на IP Ingress кластера ресурсной платформы**)<br/><br/>Если указан в формате `myapp`, DNS-запись будет автоматически создана в служебной DNS-зоне'
              is_modifiable: false
        - id: 1022
          code: appConfiguration
          data_type: map-fixed
          required: true
          sort: 40
          is_modifiable: true
          sub_params:
            - id: 435
              code: version
              data_type: string
              required: true
              default: "6.0"
              value_list:
                - "5.4"
                - "6.0"
              is_modifiable: false
            - id: 436
              code: gitPath
              data_type: string
              required: true
              default: https://github.com/xahys/testlucee
              man: 'Путь до репозитория приложения<br/>Обязательно должен быть передан как URL: `https://....`<br/><br/>Должен быть сетевой доступ до URL для скачивания исходников'
              is_modifiable: false
            - id: 437
              code: healthPath
              data_type: string
              required: false
              default: ""
              man: Путь до healtcheck для запуска пода в Kubernetes, который отдаст 200 код<br/>Пустое значение означает, что будет проверяться исключительно доступность приложения по порту
              is_modifiable: false
        - id: 1023
          code: jsonEnv
          data_type: map
          required: false
          default: '{}'
          man: Передаётся в формате КЛЮЧ:ЗНАЧЕНИЕ
          sort: 50
          is_modifiable: true
    - name: delete
      id: 50
      kind: instance
      action: delete
      params: []
    - name: modify
      id: 55
      kind: instance
      action: modify
      params:
        - id: 1024
          code: clusterConfiguration
          data_type: map-fixed
          required: true
          sort: 10
          sub_params:
            - id: 438
              code: cpu
              data_type: string
              required: true
              default: ""
              man: Указывается в Milicores<br/>`1000` Mili == `1` Ядро
              is_modifiable: false
            - id: 439
              code: memory
              data_type: integer &gt; 0
              required: true
              default: ""
              man: Указывается в Megabytes
              is_modifiable: false
            - id: 440
              code: replicas
              data_type: integer &gt; 0
              required: true
              default: ""
              value_list:
                - "1"
                - "3"
                - "5"
                - "7"
              is_modifiable: false
        - id: 1025
          code: appConfiguration
          data_type: map-fixed
          required: true
          sort: 20
          sub_params:
            - id: 441
              code: version
              data_type: string
              required: true
              default: ""
              value_list:
                - "6.0"
                - "5.4"
              is_modifiable: false
            - id: 442
              code: gitPath
              data_type: string
              required: true
              default: ""
              man: 'Путь до репозитория приложения<br/>Обязательно должен быть передан как URL: `https://....`<br/><br/>Должен быть сетевой доступ до URL для скачивания исходников'
              is_modifiable: false
            - id: 443
              code: healthPath
              data_type: string
              required: false
              default: ""
              man: Путь до healtcheck для запуска пода в Kubernetes, который отдаст 200 код<br/>Пустое значение означает, что будет проверяться исключительно доступность приложения по порту
              is_modifiable: false
        - id: 1026
          code: jsonEnv
          data_type: map
          required: false
          man: Передаётся в формате КЛЮЧ:ЗНАЧЕНИЕ
          sort: 30
    - name: reconcile
      id: 373
      kind: action
      action: reconcile
      params: []
    - name: redeploy
      id: 53
      kind: action
      action: redeploy
      params:
        - id: 1027
          code: startupConfiguration
          data_type: map-fixed
          required: true
          sort: 10
          sub_params:
            - id: 444
              code: resourceRealm
              data_type: string
              required: true
              default: k8s-4-ext-nubes-ru
              value_list:
                - k8s-4-ext-nubes-ru
              man: Кластер Kubernetes, на котором будет развернут экземпляр
              is_modifiable: false
    - name: restart
      id: 163
      kind: action
      action: restart
      params: []
    - name: resume
      id: 95
      kind: instance
      action: resume
      params: []
    - name: suspend
