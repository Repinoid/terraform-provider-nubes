name: vc_mgmt_sthutrval_cluster
service_id: 148
service_display_name: Менеджмент Kubernetes кластер Штурвал
service_short_name: vcMgmtSthutrvalCluster
lifecycle:
    suspend_on_destroy_default: false
    adopt_existing_on_create_default: false
outputs:
    params:
        - code: state_params
          type: map
        - code: state_out
          type: map
        - code: state_params_flat
          type: map
        - code: state_out_flat
          type: map
        - code: vault_secrets
          type: map
          sensitive: true
        - code: vault_url
          type: string
        - code: vault_user_path
          type: string
        - code: vault_fields
          type: list
operations:
    - name: create
      id: 258
      kind: instance
      action: create
      params:
        - id: 771
          code: startupConfiguration
          data_type: map-fixed
          required: true
          sort: 10
          sub_params:
            - id: 89
              code: clusterName
              data_type: string
              required: true
              default: k8s-zu1wq4bp
              regex: (?=^.{1,16}$)^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
              is_modifiable: false
            - id: 91
              code: resourceRealm
              data_type: string
              required: true
              default: ngcloud.ru
              value_list:
                - ngcloud.ru
              descr: Облако в котором будет развёрнут тенант
              man: Выбрать платформу из списка<br/><br/>**Если список не отображается**<br/>обратитесь к сервис менеджеру с вопросом предоставления ресурсной платформы
              is_modifiable: false
            - id: 700
              code: providerVdc
              data_type: string
              required: true
              default: ""
              man: Приписка `2.8` - Скорость vCPU - 2800MHz<br/>И так далее...<br/>
              is_modifiable: false
            - id: 701
              code: networkProvider
              data_type: string
              required: true
              default: ""
              is_modifiable: false
        - id: 772
          code: clusterConfiguration
          data_type: map-fixed
          required: true
          sort: 20
          sub_params:
            - id: 90
              code: appVersion
              data_type: string
              required: true
              default: 2.14.0
              value_list:
                - 2.14.0
                - 2.13.1
                - 2.12.1
                - 2.11.0
              is_modifiable: false
        - id: 773
          code: controlPlaneConfiguration
          data_type: map-fixed
          required: true
          sort: 30
          sub_params:
            - id: 92
              code: sizingPolicy
              data_type: string
              required: true
              default: ""
              value_list:
                - '{}'
              man: Доступные sizing Policy представлены исходя из ресурсной платформы, которая была выбрана
              is_modifiable: false
            - id: 93
              code: sizingDisk
              data_type: integer &gt; 0
              required: true
              default: "50"
              is_modifiable: false
            - id: 94
              code: count
              data_type: integer &gt; 0
              required: true
              default: "1"
              value_list:
                - "1"
                - "3"
                - "5"
              is_modifiable: false
        - id: 774
          code: workerConfiguration
          data_type: array-map-fixed
          required: true
          default: '[{}]'
          sort: 40
          sub_params:
            - id: 95
              code: groupName
              data_type: string
              required: true
              default: workers-apb7nqgk
              regex: (?=^.{3,40}$)^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
              man: Имена групп воркеров в рамках кластера должно быть уникальным
              is_modifiable: false
            - id: 96
              code: sizingPolicy
              data_type: string
              required: true
              default: ""
              value_list:
                - '{}'
              man: Доступные sizing Policy представлены исходя из ресурсной платформы, которая была выбрана
              is_modifiable: false
            - id: 97
              code: sizingDisk
              data_type: integer &gt; 0
              required: true
              default: "50"
              is_modifiable: false
            - id: 98
              code: count
              data_type: integer &gt; 0
              required: true
              default: "2"
              is_modifiable: false
            - id: 693
              code: autoscale
              data_type: boolean
              required: true
              default: "false"
              value_list:
                - "false"
                - "true"
              man: Включает автоматическое масштабирование нод<br/>Имеет приоритет над параметром **Кол-во узлов Workers**, если включен
              is_modifiable: false
            - id: 694
              code: autoscaleMin
              data_type: integer &gt; 0
              required: true
              default: "2"
              man: Параметр к **Autoscale**<br/><br/>**Автоскейл с 0** пока не доступен - ограничение cluster API
              is_modifiable: false
            - id: 695
              code: autoscaleMax
              data_type: integer &gt; 0
              required: true
              default: "3"
              man: Параметр к **Autoscale**<br/><br/>Нельзя указать меньше чем **Минимальное кол-во нод**
              is_modifiable: false
            - id: 696
              code: labelDeck
              data_type: boolean
              required: true
              default: "true"
              value_list:
                - "true"
                - "false"
              man: Позволяет на данной группе узлов разворачивать услуги из Личного кабинета<br/>Необходимо выключить если планируется, что на части узлов будет настроен к примеру только Ingress
              is_modifiable: false
        - id: 775
          code: accessConfiguration
          data_type: map-fixed
          required: true
          sort: 50
          sub_params:
            - id: 99
              code: needExternalAddressAPI
              data_type: boolean
              required: true
              default: "true"
              value_list:
                - "true"
              man: Выделяет внешний IP для доступа к kubernetes API. Пока нельзя выставить false
              is_modifiable: false
            - id: 100
              code: accessIpListAPI
              data_type: json
              required: true
              default: '[]'
              man: 'Access IP List для подключения к Kubernetes API. Указывается массив. Если передан пустой массив, доступ выделяется всем<br/>Пример: **[&quot;0.0.0.0/0&quot;]** или **[]** или **[&quot;178.4.13.2&quot;, &quot;178.4.14.0/24&quot;]**'
              is_modifiable: false
            - id: 101
              code: needExternalAddressIngress
              data_type: boolean
              required: true
              default: "true"
              value_list:
                - "true"
              man: Выделяет внешний IP для доступа к Ingress
              is_modifiable: false
            - id: 102
              code: accessIpListIngress
              data_type: json
              required: true
              default: '[]'
              man: 'Access IP List для подключения к Ingress. Указывается массив. Если передан пустой массив, доступ выделяется всем<br/>Пример: **[&quot;0.0.0.0/0&quot;]** или **[]** или **[&quot;178.4.13.2&quot;, &quot;178.4.14.0/24&quot;]**'
              is_modifiable: false
