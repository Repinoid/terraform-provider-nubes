name: nodejs
service_id: 95
service_display_name: NodeJS
service_short_name: nodejs
service_man: Развертывает контейнер в k8s кластере с node, который можно использовать для запуска своих приложений.<br/>Приложение должно быть доступно по ссылки в git репозитории, которая является входным параметром.
lifecycle:
    suspend_on_destroy_default: true
    adopt_existing_on_create_default: false
outputs:
    params:
        - code: state_params
          type: map
        - code: state_out
          type: map
        - code: state_params_flat
          type: map
        - code: state_out_flat
          type: map
        - code: vault_secrets
          type: map
          sensitive: true
        - code: vault_url
          type: string
        - code: vault_user_path
          type: string
        - code: vault_fields
          type: list
operations:
    - name: create
      id: 58
      kind: instance
      action: create
      params:
        - id: 1028
          code: startupConfiguration
          data_type: map-fixed
          required: true
          sort: 10
          sub_params:
            - id: 445
              code: resourceRealm
              data_type: string
              required: true
              default: ""
              value_list:
                - iot-naeel
                - k8s-3-sandbox-nubes-ru
                - k8s-4-sandbox-nubes-ru
              man: Кластер Kubernetes, на котором будет развернут экземпляр
              is_modifiable: false
        - id: 1029
          code: clusterConfiguration
          data_type: map-fixed
          required: true
          sort: 20
          is_modifiable: true
          sub_params:
            - id: 446
              code: cpu
              data_type: integer &gt; 0
              required: true
              default: "200"
              man: Указывается в Milicores<br/>`1000` Mili == `1` Ядро
              is_modifiable: false
            - id: 447
              code: memory
              data_type: integer &gt; 0
              required: true
              default: "256"
              man: Указывается в Megabytes
              is_modifiable: false
            - id: 448
              code: replicas
              data_type: integer &gt; 0
              required: true
              default: "1"
              value_list:
                - "1"
                - "3"
                - "5"
                - "7"
              is_modifiable: false
        - id: 1030
          code: accessConfiguration
          data_type: map-fixed
          required: true
          sort: 30
          sub_params:
            - id: 449
              code: domain
              data_type: string
              required: true
              default: node-yj4bdauf
              man: 'Если указан FQDN в формате: `myapp.example.com`, предварительно будет проверяться DNS-запись (А-запись **должна смотреть на IP Ingress кластера ресурсной платформы**)<br/><br/>Если указан в формате `myapp`, DNS-запись будет автоматически создана в служебной DNS-зоне'
              is_modifiable: false
        - id: 1031
          code: appConfiguration
          data_type: map-fixed
          required: true
          sort: 40
          is_modifiable: true
          sub_params:
            - id: 450
              code: version
              data_type: string
              required: true
              default: "23"
              value_list:
                - "18"
                - "20"
                - "22"
                - "23"
              is_modifiable: false
            - id: 451
              code: gitPath
              data_type: string
              required: true
              default: https://github.com/xahys/testnode.git
              man: 'Путь до репозитория приложения<br/>Обязательно должен быть передан как URL: `https://....`<br/><br/>Должен быть сетевой доступ до URL для скачивания исходников'
              is_modifiable: false
            - id: 452
              code: healthPath
              data_type: string
              required: false
              default: ""
              man: Путь до healtcheck для запуска пода в Kubernetes, который отдаст 200 код<br/>Пустое значение означает, что будет проверяться исключительно доступность приложения по порту
              is_modifiable: false
        - id: 1032
          code: jsonEnv
          data_type: map
          required: false
          default: '{}'
          man: Передаётся в формате КЛЮЧ:ЗНАЧЕНИЕ
          sort: 50
          is_modifiable: true
    - name: delete
      id: 61
      kind: instance
      action: delete
      params: []
    - name: modify
      id: 59
      kind: instance
      action: modify
      params:
        - id: 1033
          code: clusterConfiguration
          data_type: map-fixed
          required: true
          sort: 10
          sub_params:
            - id: 453
              code: cpu
              data_type: integer &gt; 0
              required: true
              default: ""
              man: Указывается в Milicores<br/>`1000` Mili == `1` Ядро
              is_modifiable: false
            - id: 454
              code: memory
              data_type: integer &gt; 0
              required: true
              default: ""
              man: Указывается в Megabytes
              is_modifiable: false
            - id: 455
              code: replicas
              data_type: integer &gt; 0
              required: true
              default: ""
              value_list:
                - "1"
                - "3"
                - "5"
                - "7"
              is_modifiable: false
        - id: 1034
          code: appConfiguration
          data_type: map-fixed
          required: true
          sort: 20
          sub_params:
            - id: 456
              code: version
              data_type: string
              required: true
              default: ""
              value_list:
                - "18"
                - "20"
                - "22"
                - "23"
              is_modifiable: false
            - id: 457
              code: gitPath
              data_type: string
              required: true
              default: ""
              man: 'Путь до репозитория приложения<br/>Обязательно должен быть передан как URL: `https://....`<br/><br/>Должен быть сетевой доступ до URL для скачивания исходников'
              is_modifiable: false
            - id: 458
              code: healthPath
              data_type: string
              required: false
              default: ""
              man: Путь до healtcheck для запуска пода в Kubernetes, который отдаст 200 код<br/>Пустое значение означает, что будет проверяться исключительно доступность приложения по порту
              is_modifiable: false
        - id: 1035
          code: jsonEnv
          data_type: map
          required: false
          man: Передаётся в формате КЛЮЧ:ЗНАЧЕНИЕ
          sort: 30
    - name: reconcile
      id: 374
      kind: action
      action: reconcile
      params: []
    - name: redeploy
      id: 60
      kind: action
      action: redeploy
      params:
        - id: 1036
          code: startupConfiguration
          data_type: map-fixed
          required: true
          sort: 10
          sub_params:
            - id: 459
              code: resourceRealm
              data_type: string
              required: true
              default: ""
              value_list:
                - iot-naeel
                - k8s-3-sandbox-nubes-ru
                - k8s-4-sandbox-nubes-ru
              man: Кластер Kubernetes, на котором будет развернут экземпляр
              is_modifiable: false
    - name: resume
      id: 121
      kind: instance
      action: resume
      params: []
    - name: suspend
      id: 120
      kind: instance
      action: suspend
      params: []
