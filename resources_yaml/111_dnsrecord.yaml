name: dnsrecord
service_id: 111
service_display_name: DNS запись
service_short_name: dnsrecord
service_man: Необходима DNS зона, в которой будет создана DNS запись.<br/>Выберите <br/>* Зону в которой будет создана запись<br/>* Тип записи<br/>* Имя записи<br/>* Значение записи
lifecycle:
    suspend_on_destroy_default: false
    adopt_existing_on_create_default: false
outputs:
    params:
        - code: state_params
          type: map
        - code: state_out
          type: map
        - code: state_params_flat
          type: map
        - code: state_out_flat
          type: map
        - code: vault_secrets
          type: map
          sensitive: true
        - code: vault_url
          type: string
        - code: vault_user_path
          type: string
        - code: vault_fields
          type: list
operations:
    - name: create
      id: 45
      kind: instance
      action: create
      params:
        - id: 75
          code: zoneUid
          data_type: uuid
          required: true
          ref_svc_id: 109
          descr: UUID экземпляра услуги DNS-зоны
          man: UUID экземпляра услуги DNS-зоны
          sort: 10
        - id: 76
          code: recordType
          data_type: string
          required: true
          value_list:
            - A
            - AAAA
            - CNAME
            - MX
            - PTR
            - SOA
            - SRV
            - TXT
            - LUA
            - NS
            - SSHFP
          descr: Тип DNS-записи
          man: Тип DNS-записи
          sort: 20
        - id: 77
          code: recordName
          data_type: string
          required: true
          unique_scope: parent
          descr: Имя записи. Имя зоны в конце проставляется автоматически
          man: Имя записи. Имя зоны в конце проставляется автоматически
          sort: 30
        - id: 78
          code: recordInput
          data_type: string
          required: true
          descr: Значение. Необходима валидация, в зависимости от типа записи. Должно быть заменено на UUID-внешнийIP
          man: Значение. Необходима валидация, в зависимости от типа записи. Должно быть заменено на UUID-внешнийIP
          sort: 40
          is_modifiable: true
        - id: 450
          code: recordTTL
          data_type: integer &gt; 0
          required: true
          default: "3600"
          maxvalue: 604800
          minvalue: 30
          descr: Time-to-Leave записи. Раз в какое время запись будет обновлена
          sort: 50
    - name: delete
      id: 46
      kind: instance
      action: delete
      params: []
    - name: modify
      id: 90
      kind: instance
      action: modify
      params:
        - id: 256
          code: recordInput
          data_type: string
          required: true
          descr: Запись. Необходима валидация, в зависимости от типа записи. Должно быть заменено на UUID-внешнийIP
    - name: reconcile
      id: 408
      kind: action
      action: reconcile
      params: []
