                - "15"
                - "20"
              man: Требует включения autoScale. Позволяет указать в процентах расширение от текущего макс объема<br/>Минимальный размер на который расширяется - **1Gb**
              is_modifiable: false
        - id: 851
          code: clickhouseFilesConfiguration
          data_type: array-map-fixed
          required: false
          man: 'Формат:<br/> - path: somethings3.xml<br/>   xmlConfig: ''&lt;clickhouse&gt;......&lt;/clickhouse&gt;'''
