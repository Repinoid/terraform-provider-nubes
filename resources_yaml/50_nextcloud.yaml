              data_type: integer &gt; 0
              required: true
              default: ""
              value_list:
                - "1024"
                - "2048"
                - "3072"
                - "4096"
                - "5120"
                - "6144"
                - "7168"
                - "8192"
              man: Указывается в Megabytes
              is_modifiable: false
            - id: 506
              code: replicas
              data_type: integer &gt; 0
              required: true
              default: ""
              value_list:
                - "1"
                - "2"
              is_modifiable: false
            - id: 507
              code: disk
              data_type: integer &gt; 0
              required: true
              default: ""
              man: Указывается в GIGAbytes<br/>На данном диске хранятся данные Nextcloud
              is_modifiable: false
        - id: 1060
          code: appConfiguration
          data_type: map-fixed
          required: true
          sort: 20
          sub_params:
            - id: 508
              code: version
              data_type: string
              required: true
              default: ""
              value_list:
                - 33.0.4
              is_modifiable: false
            - id: 509
              code: documentServer
              data_type: string
              required: true
              default: ""
              value_list:
                - collabora
              man: Выбор сервера документов (onlyoffice)/(collabora). onlyoffice пока не доступен<br/>Размер пода collabora:<br/>1.8 ядра. 2Gi ОЗУ
              is_modifiable: false
            - id: 550
              code: logLevel
              data_type: string
              required: true
              default: ""
              value_list:
                - DEBUG
                - INFO
                - WARN
                - ERROR
                - FATAL
                - NONE
              man: Включает отображение логов самого nextcloud<br/>Логи уходят в /dev/stdout контейнера<br/>`NONE` отключает логирование
              is_modifiable: false
    - name: reconcile
      id: 390
      kind: action
      action: reconcile
      params: []
    - name: recovery
      id: 406
      kind: action
      action: recovery
      params:
        - id: 1078
          code: startupConfiguration
          data_type: map-fixed
          required: true
          sort: 10
          sub_params:
            - id: 556
              code: resourceRealm
              data_type: string
              required: true
              default: ""
              value_list:
                - iot-naeel
                - k8s-3-sandbox-nubes-ru
                - k8s-4-sandbox-nubes-ru
              man: Кластер Kubernetes, на котором будет развернут экземпляр
              is_modifiable: false
            - id: 557
