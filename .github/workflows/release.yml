name: Build and release provider

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: PROVIDER_GPG_KEY_ID
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test provider
        run: go test ./...

      - name: Build and sign release assets
        env:
          SIGNING_KEY: ${{ secrets.PROVIDER_GPG_PRIVATE_KEY }}
          SIGNING_KEY_ID: ${{ vars.PROVIDER_GPG_KEY_ID }}
          SIGNING_PASSPHRASE: ${{ secrets.PROVIDER_GPG_PASSPHRASE }}
        run: |
          test -n "$SIGNING_KEY"
          test -n "$SIGNING_KEY_ID"
          printf '%s' "$SIGNING_KEY" > "$RUNNER_TEMP/provider-signing-key.asc"
          printf '%s' "$SIGNING_PASSPHRASE" > "$RUNNER_TEMP/provider-signing-passphrase"
          chmod 600 "$RUNNER_TEMP/provider-signing-key.asc" "$RUNNER_TEMP/provider-signing-passphrase"
          version="${GITHUB_REF_NAME#v}"
          GPG_KEY_FILE="$RUNNER_TEMP/provider-signing-key.asc" \
          GPG_KEY_ID="$SIGNING_KEY_ID" \
          GPG_PASSPHRASE_FILE="$RUNNER_TEMP/provider-signing-passphrase" \
            bash scripts/build-release.sh "$version" dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
